name: CI - Retrain Telco Churn Model

on:
  push:
    branches: [main]
    paths:
      - "MLProject/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: telco-churn

jobs:
  train-and-build:
    runs-on: ubuntu-24.04

    steps:
      - name: Set up job
        run: echo "Mulai CI retraining model churn"

      - name: Run actions/checkout@v4
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Check Env
        run: |
          python --version
          pip --version
          ls -R MLProject | head -50

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow==2.19.0 scikit-learn==1.5.2 pandas==2.2.3 numpy==1.26.4 matplotlib==3.9.2

      - name: Run mlflow project
        run: |
          mlflow run MLProject --env-manager=local --experiment-name telco-churn-ci

      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(python -c "import mlflow; c=mlflow.MlflowClient(tracking_uri='file:./mlruns'); exps=[e.experiment_id for e in c.search_experiments()]; print(c.search_runs(exps, order_by=['attributes.start_time DESC'], max_results=1)[0].info.run_id)")
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Upload to GitHub (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mlruns-${{ env.RUN_ID }}
          path: mlruns/

      - name: Upload to GitHub (commit to repository)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mlruns
          git diff --cached --quiet || git commit -m "Save MLflow artifacts for run ${{ env.RUN_ID }} [skip ci]"
          git push

      - name: Build Docker Model
        run: |
          mlflow models build-docker --model-uri "runs:/${{ env.RUN_ID }}/model" --name "${{ env.IMAGE_NAME }}"
        env:
          MLFLOW_TRACKING_URI: file:./mlruns

      - name: Tag Docker Image
        run: |
          docker tag ${{ env.IMAGE_NAME }} ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_HUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest

      - name: Post Log in to Docker Hub
        run: echo "Image terkirim ke Docker Hub"
